name: Release

# Builds a native installer per OS and publishes a GitHub Release.
# Trigger: push a tag like v0.1.0, or run manually (workflow_dispatch).
# jpackage versioning requires numeric tags (vMAJOR.MINOR[.PATCH]).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 0.1.0, without leading v)"
        required: true
        default: "0.0.1"

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # jpackage Linux 'deb' output needs dpkg-deb (preinstalled, but make sure).
      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y dpkg-dev fakeroot

      # jpackage Windows 'msi' output needs WiX Toolset 3.x (candle/light on PATH).
      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
          }
          candle.exe -? | Select-Object -First 1

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${{ inputs.version }}"
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Building version: $VER"

      - name: Build, test, package
        shell: bash
        run: ./gradlew :desktop:build :desktop:jpackageImage :desktop:jpackageInstaller "-PappVersion=${{ steps.version.outputs.ver }}" --stacktrace

      # Extra single-file bundle for Linux, no root/install needed.
      - name: Build AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew :desktop:appImage "-PappVersion=${{ steps.version.outputs.ver }}" --stacktrace

      - name: Stage release files (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp desktop/build/jpackage/*.deb "dist/lotp-desktop-${{ steps.version.outputs.ver }}-linux-x86_64.deb"
          cp desktop/build/appimage/*.AppImage "dist/lotp-desktop-${{ steps.version.outputs.ver }}-linux-x86_64.AppImage"

      - name: Stage release files (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $ver = "${{ steps.version.outputs.ver }}"
          Copy-Item desktop/build/jpackage/*.msi "dist/lotp-desktop-$ver-windows-x86_64.msi"
          Compress-Archive -Path desktop/build/jpackage/lotp-desktop/* `
            -DestinationPath "dist/lotp-desktop-$ver-windows-x86_64.zip" -Force

      - name: Upload staged files
        uses: actions/upload-artifact@v4
        with:
          name: lotp-dist-${{ matrix.os }}
          path: dist/
          retention-days: 7

  github-release:
    name: Publish GitHub Release
    needs: package
    # Only auto-publish on tags; manual runs just produce downloadable artifacts.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lotp-dist-*
          merge-multiple: true
          path: dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
